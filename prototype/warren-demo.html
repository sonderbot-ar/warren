<title>Warren Classroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a course workspace. Thin top bar, a five-step journey rail, one working screen, and a "source" drawer that slides in when any number is clicked. */
:root {
  --paper: #F3F6F5;
  --surface: #FFFFFF;
  --ink: #13212B;
  --muted: #5A6A72;
  --line: #D5DDDC;
  --accent: #0E6E5C;
  --accent-soft: #DCEEE9;
  --mark: rgba(242, 208, 60, .55);
  --warn: #A9502A;
  --warn-soft: #F7E6DD;
  --good: #2F7D4A;
  --bar: #13212B;
  --bar-ink: #E9F1EF;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E161B; --surface: #152129; --ink: #E4ECEE; --muted: #93A4AB; --line: #263741;
    --accent: #45B89B; --accent-soft: #173A33; --mark: rgba(242, 208, 60, .28);
    --warn: #E39068; --warn-soft: #3A2419; --good: #6CC48A; --bar: #08100F; --bar-ink: #E4ECEE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E161B; --surface: #152129; --ink: #E4ECEE; --muted: #93A4AB; --line: #263741;
  --accent: #45B89B; --accent-soft: #173A33; --mark: rgba(242, 208, 60, .28);
  --warn: #E39068; --warn-soft: #3A2419; --good: #6CC48A; --bar: #08100F; --bar-ink: #E4ECEE;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; font-family: var(--f-body); }
p { margin: 0; }
.num, td.n, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-ink); }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.logo svg { display: block; }
.course { font-size: 13px; opacity: .75; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 2px; }
.seg button { background: none; border: 0; color: var(--bar-ink); font-size: 12.5px; padding: 4px 11px; border-radius: 999px; opacity: .75; }
.seg button[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar); opacity: 1; font-weight: 600; }

/* journey rail */
.rail { border-bottom: 1px solid var(--line); background: var(--surface); }
.rail .wrap { display: flex; gap: 4px; overflow-x: auto; padding-block: 0; scrollbar-width: none; }
.rail a { display: flex; align-items: center; gap: 8px; padding: 12px 12px; text-decoration: none; color: var(--muted); font-size: 13.5px; white-space: nowrap; border-bottom: 2px solid transparent; }
.rail a .k { font-family: var(--f-mono); font-size: 11px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); }
.rail a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.rail a[aria-current="page"] .k { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.rail .who { margin-left: auto; align-self: center; font-size: 11.5px; color: var(--muted); padding-left: 12px; white-space: nowrap; }

main { padding-block: 28px 40px; }
.view { display: grid; gap: 22px; }
.head { display: grid; gap: 8px; max-width: 760px; }
.head p { color: var(--muted); font-size: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 820px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }

/* the "why not Excel" strip on every screen */
.why { display: flex; gap: 12px; align-items: flex-start; border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 14px; }
.why b { font-family: var(--f-display); white-space: nowrap; }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* assignment */
.memo { display: grid; gap: 14px; }
.memo .from { display: flex; gap: 12px; align-items: center; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-family: var(--f-display); flex: none; }
.task { display: grid; gap: 10px; counter-reset: t; padding: 0; margin: 0; list-style: none; }
.task li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.task li::before { counter-increment: t; content: counter(t); font-family: var(--f-mono); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; }
.chip { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }

/* statements */
.asof { display: grid; gap: 8px; }
.asof-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.asof-date { font-family: var(--f-mono); font-size: 22px; font-weight: 500; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.ticks { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); }
.tablebox { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr.sub td { color: var(--muted); font-size: 13px; }
tr.sec td { padding-top: 14px; font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; border-bottom: 0; }
td.n button { background: none; border: 0; padding: 1px 4px; margin: -1px -4px; border-radius: 3px; font: inherit; color: var(--ink); text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
td.n button:hover, td.n button.on { background: var(--mark); text-decoration: none; }
td.locked { color: var(--warn); font-family: var(--f-body); font-size: 12px; background: repeating-linear-gradient(135deg, transparent 0 6px, var(--warn-soft) 6px 8px); }
th.locked { color: var(--warn); }
.hint { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.hint i { display: inline-block; width: 26px; height: 12px; background: var(--mark); border-radius: 2px; }

/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 40; transform: translateX(105%); transition: transform .22s ease; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); box-shadow: -12px 0 30px rgba(0,0,0,.12); }
.drawer.open { transform: none; }
.drawer header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.drawer .x { background: none; border: 1px solid var(--line); border-radius: 6px; width: 30px; height: 30px; }
.drawer .body { padding: 18px; overflow-y: auto; display: grid; gap: 16px; align-content: start; }
.big { font-family: var(--f-mono); font-size: 30px; font-weight: 500; background: var(--mark); display: inline-block; padding: 0 6px; border-radius: 3px; }
.chain { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.chain > div { padding: 10px 12px; display: grid; gap: 2px; font-size: 13.5px; }
.chain > div + div { border-top: 1px dashed var(--line); }
.chain .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chain code { font-family: var(--f-mono); font-size: 13px; word-break: break-all; }
.excel { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.excel .cell { font-family: var(--f-mono); background: var(--paper); border: 1px solid var(--line); padding: 4px 8px; color: var(--ink); }
.scrim { position: fixed; inset: 0; background: rgba(10, 20, 25, .35); z-index: 35; }

/* valuation */
.sliders { display: grid; gap: 16px; }
.sl { display: grid; gap: 4px; }
.sl-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.sl-top label { font-weight: 600; font-size: 14px; }
.sl-top output { font-family: var(--f-mono); font-size: 15px; font-weight: 500; }
.sl small { color: var(--muted); font-size: 12.5px; }
.sl small b { color: var(--ink); font-weight: 500; }
.result { display: grid; gap: 14px; }
.range { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.range div { display: grid; gap: 2px; padding: 10px 6px; border-radius: 8px; border: 1px solid var(--line); }
.range div.mid { border-color: var(--accent); background: var(--accent-soft); }
.range .v { font-family: var(--f-mono); font-size: 22px; font-weight: 500; }
.range .l { font-size: 11.5px; color: var(--muted); }
svg text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.note { font-size: 13px; color: var(--muted); }
.submitted { display: flex; gap: 10px; align-items: center; color: var(--good); font-weight: 600; font-size: 14px; }

/* reality */
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 92px; gap: 10px; align-items: center; font-size: 13.5px; }
.bar .track { height: 22px; position: relative; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--line); }
.bar.you .fill { background: var(--accent); }
.bar.actual .fill { background: var(--ink); }
.bar .val { font-family: var(--f-mono); text-align: right; }
.bar .err { font-size: 11.5px; color: var(--muted); display: block; }
@media (max-width: 520px) { .bar { grid-template-columns: 96px minmax(0, 1fr) 80px; } }
.stat { display: grid; gap: 4px; }
.stat .v { font-family: var(--f-display); font-size: 30px; font-weight: 700; }
.stat .d { font-size: 13px; color: var(--muted); }
.quote { font-size: 15px; border-left: 3px solid var(--line); padding-left: 12px; }

/* professor */
.roster td:nth-child(2), .roster th:nth-child(2) { text-align: left; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.teaser { border: 1px dashed var(--accent); background: transparent; }
.flag { font-size: 12px; color: var(--good); font-weight: 600; }

footer { border-top: 1px solid var(--line); padding-block: 18px 30px; font-size: 12.5px; color: var(--muted); }
footer .wrap { display: grid; gap: 4px; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="logo" aria-label="Warren">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="12" width="4" height="9" rx="1" fill="currentColor" opacity=".55"/><rect x="7" y="7" width="4" height="14" rx="1" fill="currentColor" opacity=".75"/><rect x="13" y="2" width="4" height="19" rx="1" fill="currentColor"/><circle cx="19.5" cy="3.5" r="2" fill="#F2D03C"/></svg>
      Warren
    </div>
    <div class="course" id="course"></div>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-en" data-lang="en">EN</button>
      <button id="lang-es" data-lang="es">ES</button>
    </div>
  </div>
</header>
<nav class="rail" aria-label="Journey"><div class="wrap" id="rail"></div></nav>
<main><div class="wrap" id="app"></div></main>

<div class="scrim" id="scrim" hidden></div>

  <div class="body" id="dr-body"></div>
</aside>

<script>
// ---------- language ----------
let lang = 'en';
try { lang = localStorage.getItem('warren-demo-lang') || 'en'; } catch (e) {}
const L = (en, es) => lang === 'es' ? es : en;

// ---------- real data: The Coca-Cola Company (CIK 0000021344), US$ millions ----------
// Pulled with Warren's own point-in-time data layer (SEC EDGAR company facts).
const F22 = { form: '10-K', fy: 'FY2022', filed: '2023-02-21', acc: '0000021344-23-000011' };
const F23 = { form: '10-K', fy: 'FY2023', filed: '2024-02-20', acc: '0000021344-24-000009' };
const F24 = { form: '10-K', fy: 'FY2024', filed: '2025-02-20', acc: '0000021344-25-000011' };
const YEARS = [2020, 2021, 2022, 2023];
const ITEMS = [
  { sec: ['Income statement', 'Estado de resultados'] },
  { k: 'revenue', n: ['Revenue', 'Ingresos'], tag: 'us-gaap:Revenues', v: [33014, 38655, 43004, 45754] },
  { k: 'cogs', n: ['Cost of goods sold', 'Costo de ventas'], tag: 'us-gaap:CostOfGoodsAndServicesSold', v: [13433, 15357, 18000, 18520] },
  { k: 'ebit', n: ['Operating income', 'Utilidad de operación'], tag: 'us-gaap:OperatingIncomeLoss', v: [8997, 10308, 10909, 11311] },
  { k: 'margin', derived: true, n: ['Operating margin', 'Margen operativo'] },
  { k: 'ni', n: ['Net income', 'Utilidad neta'], tag: 'us-gaap:ProfitLoss', v: [7768, 9804, 9571, 10703] },
  { sec: ['Cash flow', 'Flujo de efectivo'] },
  { k: 'da', n: ['Depreciation & amortization', 'Depreciación y amortización'], tag: 'us-gaap:DepreciationDepletionAndAmortization', v: [1536, 1452, 1260, 1128] },
  { k: 'capex', n: ['Capital expenditure', 'Inversión en activo fijo (capex)'], tag: 'us-gaap:PaymentsToAcquirePropertyPlantAndEquipment', v: [1177, 1367, 1484, 1852] },
  { sec: ['Balance sheet', 'Balance general'] },
  { k: 'cash', n: ['Cash', 'Efectivo'], tag: 'us-gaap:CashAndCashEquivalentsAtCarryingValue', v: [6795, 9684, 9519, 9366] },
  { k: 'ltd', n: ['Long-term debt', 'Deuda de largo plazo'], tag: 'us-gaap:LongTermDebtNoncurrent', v: [40125, 38116, 36377, 35547] },
  { k: 'shares', n: ['Diluted shares (millions)', 'Acciones diluidas (millones)'], tag: 'us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding', v: [4323, 4340, 4350, 4339] },
];
// Which annual report a figure comes from, as Warren would pick it on a given date:
// the newest filing already public. FY2020 stays on the FY2022 10-K; long-term debt FY2020 on the FY2021 10-K.
function sourceFor(item, year, asOf) {
  if (item.k === 'ltd' && year === 2020) return { form: '10-K', fy: 'FY2021', filed: '2022-02-22', acc: '0000021344-22-000009' };
  if (year === 2023) return F23;
  if (year === 2020) return F22;
  if (item.k === 'ltd' && year === 2021) return F22;
  return asOf >= F23.filed ? F23 : F22;
}
const publicOn = y => y === 2023 ? F23.filed : F22.filed;
const edgar = acc => `https://www.sec.gov/Archives/edgar/data/21344/${acc.replace(/-/g, '')}/`;
const fmt = (x, d = 0) => x.toLocaleString(lang === 'es' ? 'es-MX' : 'en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (x, d = 1) => fmt(x * 100, d) + '%';
const fdate = s => new Date(s + 'T12:00:00Z').toLocaleDateString(lang === 'es' ? 'es-MX' : 'en-US', { day: 'numeric', month: 'short', year: 'numeric' });

// ---------- state ----------
const DEADLINE = '2024-03-31';
const state = {
  asOfIdx: 3,
  a: { g: 5.0, m: 24.5, t: 18.0, r: 1.6, w: 7.0, tg: 2.5 },
  submitted: false,
};
const ASOF = ['2023-01-15', '2023-02-21', '2023-09-30', '2024-02-19', '2024-02-20', '2024-03-31'];
state.asOfIdx = ASOF.length - 1;

// ---------- valuation math (illustrative; Warren's real engine is deterministic Python) ----------
const BASE = { rev: 45754, netDebt: 35547 + 1960 + 4209 - 9366, shares: 4339 };
function dcf(a) {
  const g = a.g / 100, m = a.m / 100, t = a.t / 100, r = a.r / 100, w = a.w / 100, tg = a.tg / 100;
  const rows = []; let rev = BASE.rev, pv = 0;
  for (let i = 1; i <= 5; i++) {
    const prev = rev; rev = rev * (1 + g);
    const ebit = rev * m, nopat = ebit * (1 - t), reinv = rev * r, fcf = nopat - reinv, df = 1 / Math.pow(1 + w, i);
    pv += fcf * df; rows.push({ y: 2023 + i, prev, rev, ebit, nopat, reinv, fcf, df, pv: fcf * df });
  }
  const last = rows[4];
  const tv = last.fcf * (1 + tg) / (w - tg), pvtv = tv * last.df;
  const ev = pv + pvtv, eq = ev - BASE.netDebt;
  return { rows, tv, pvtv, pvSum: pv, ev, eq, ps: eq / BASE.shares };
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function monteCarlo(a, n = 3000) {
  const R = rng(20240331), N = () => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const out = [];
  for (let i = 0; i < n; i++) {
    const s = { ...a, g: a.g + 1.5 * N(), m: a.m + 1.5 * N(), w: a.w + 0.5 * N(), tg: a.tg + 0.3 * N() };
    if (s.tg > s.w - 1.5) s.tg = s.w - 1.5;
    out.push(dcf(s).ps);
  }
  out.sort((x, y) => x - y);
  const q = p => out[Math.floor(p * (n - 1))];
  return { vals: out, p10: q(.1), p50: q(.5), p90: q(.9) };
}

// ---------- routing ----------
const VIEWS = ['assignment', 'company', 'valuation', 'reality', 'professor'];
const NAMES = () => [L('Assignment', 'Tarea'), L('The company', 'La empresa'), L('Your valuation', 'Tu valuación'), L('What happened', 'Qué pasó'), L('Professor view', 'Vista del profesor')];
function current() { const h = location.hash.slice(1); return VIEWS.includes(h) ? h : 'assignment'; }
function go(v) { location.hash = v; }
window.addEventListener('hashchange', () => { closeDrawer(); render(); window.scrollTo(0, 0); });

function render() {
  document.documentElement.lang = lang;
  document.getElementById('lang-en').setAttribute('aria-pressed', lang === 'en');
  document.getElementById('lang-es').setAttribute('aria-pressed', lang === 'es');
  document.getElementById('course').textContent = L('Corporate Finance II · Spring 2024 · Section B', 'Finanzas Corporativas II · Primavera 2024 · Grupo B');
  const v = current(), names = NAMES();
  document.getElementById('rail').innerHTML = VIEWS.map((id, i) =>
    `<a href="#${id}" ${id === v ? 'aria-current="page"' : ''}><span class="k">${i + 1}</span>${names[i]}</a>`).join('') +
    `<span class="who">${v === 'professor' ? L('Signed in as Prof. Ruiz', 'Sesión: Prof. Ruiz') : L('Signed in as Lucía, student', 'Sesión: Lucía, estudiante')}</span>`;
  const app = document.getElementById('app');

function traceFact(k, y) {

function drawValuation() {
  const a = state.a, d = dcf(a), mc = monteCarlo(a);
  const W = 520, H = 170, pad = 22, lo = 15, hi = 85, bins = 35, bw = (hi - lo) / bins;
  const counts = new Array(bins).fill(0);
  mc.vals.forEach(v => { const b = Math.floor((v - lo) / bw); if (b >= 0 && b < bins) counts[b]++; });
  const max = Math.max(...counts), x = v => pad + (v - lo) / (hi - lo) * (W - 2 * pad), barW = (W - 2 * pad) / bins;
  const bars = counts.map((c, i) => { const v = lo + i * bw + bw / 2, inMid = v >= mc.p10 && v <= mc.p90; const h = c / max * (H - 50);
    return `<rect x="${(pad + i * barW + 1).toFixed(1)}" y="${(H - 26 - h).toFixed(1)}" width="${(barW - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="var(${inMid ? '--accent' : '--line'})"/>`; }).join('');
  const ticks = [20, 35, 50, 65, 80].map(t => `<text x="${x(t)}" y="${H - 8}" text-anchor="middle">$${t}</text>`).join('');
  const p50x = Math.min(Math.max(x(mc.p50), pad), W - pad);
  document.getElementById('result').innerHTML = `
    <span class="eyebrow">${L('Value per share, 31 March 2024', 'Valor por acción, 31 de marzo de 2024')}</span>
    <div class="range">
      <div><span class="l">${L('Pessimistic (P10)', 'Pesimista (P10)')}</span><span class="v">$${fmt(mc.p10, 2)}</span></div>
      <div class="mid"><span class="l">${L('Middle (P50)', 'Central (P50)')}</span><span class="v">$${fmt(mc.p50, 2)}</span></div>
      <div><span class="l">${L('Optimistic (P90)', 'Optimista (P90)')}</span><span class="v">$${fmt(mc.p90, 2)}</span></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${L('Distribution of 3,000 simulated values per share', 'Distribución de 3,000 valores simulados por acción')}">
      <line x1="${pad}" x2="${W - pad}" y1="${H - 26}" y2="${H - 26}" stroke="var(--line)"/>
      ${bars}
      <line x1="${p50x}" x2="${p50x}" y1="10" y2="${H - 26}" stroke="var(--ink)" stroke-dasharray="3 3"/>
      ${ticks}
    </svg>
    <p class="note">${L(`3,000 runs, each with slightly different growth, margin and discount rate around your choices. 80% of them land between $${fmt(mc.p10, 0)} and $${fmt(mc.p90, 0)}.`, `3,000 corridas, cada una con crecimiento, margen y tasa de descuento un poco distintos alrededor de tus supuestos. El 80% cae entre $${fmt(mc.p10, 0)} y $${fmt(mc.p90, 0)}.`)}</p>
    <div class="row">${state.submitted
      ? `<span class="submitted">✓ ${L('Handed in. Your assumptions are frozen and will rebuild to the cent.', 'Entregado. Tus supuestos quedan guardados y se reconstruyen al centavo.')}</span>`

  const rowsDef = [
    ['rev', L('Revenue', 'Ingresos')], ['ebit', L('Operating income', 'Utilidad de operación')], ['nopat', L('After-tax operating income', 'Utilidad operativa después de impuestos')],
    ['reinv', L('Net investment', 'Inversión neta')], ['fcf', L('Free cash flow', 'Flujo de caja libre')], ['pv', L('Value today', 'Valor hoy')],
  ];
  document.getElementById('fc').innerHTML = `<table><thead><tr><th></th><th>FY2023 ${L('actual', 'real')}</th>${d.rows.map(r => `<th>FY${r.y}</th>`).join('')}</tr></thead><tbody>
    ${rowsDef.map(([k, n]) => `<tr><td>${n}</td><td class="n">${k === 'rev' ? `<button data-trace="revenue|2023">${fmt(BASE.rev)}</button>` : k === 'ebit' ? `<button data-trace="ebit|2023">${fmt(11311)}</button>` : ''}</td>${d.rows.map((r, i) => `<td class="n"><button data-calc="${k}|${i}">${fmt(r[k])}</button></td>`).join('')}</tr>`).join('')}
    <tr class="sub"><td>${L('Enterprise value', 'Valor de la empresa')}</td><td colspan="6" class="n"><button data-calc="ev|0">${fmt(d.ev)}</button></td></tr>
  </tbody></table>`;
}

      ${k === 'rev' && i === 0 ? `<div><span class="lbl">${L('Starting point', 'Punto de partida')}</span><span>${L('FY2023 revenue from the 10-K filed', 'Ingresos FY2023 del 10-K presentado el')} ${fdate(F23.filed)}</span></div>` : ''}
    </div>
    <p class="note">${L('The formula is the same for every student and is tested. Only the assumptions are yours, so two answers can be compared fairly.', 'La fórmula es igual para todos y está probada. Solo los supuestos son tuyos, así que dos respuestas se pueden comparar con justicia.')}</p>`);
}

// ---------- 4. reality ----------
function vReality() {
  const g = state.a.g, m = state.a.m;
  const you = BASE.rev * (1 + g / 100), actual = 47061, naive = BASE.rev, warren = 47860;
  const youM = m, actM = 9992 / 47061 * 100;
  const max = 52000;
  const bar = (cls, n, v, showErr) => `<div class="bar ${cls}"><span>${n}</span><div class="track"><div class="fill" style="width:${(v / max * 100).toFixed(1)}%"></div></div><span class="val">${fmt(v)}${showErr ? `<span class="err">${v >= actual ? '+' : ''}${pct((v - actual) / actual)}</span>` : ''}</span></div>`;
  return `<section class="view">
    <div class="head"><span class="eyebrow">${L('Step 4 · January 2025: what really happened', 'Paso 4 · Enero de 2025: qué pasó de verdad')}</span>

      <p>${L('Coca-Cola filed its FY2024 annual report on 20 February 2025. Warren scored every student\'s forecast against it the same day.', 'Coca-Cola presentó su informe anual FY2024 el 20 de febrero de 2025. Warren calificó la proyección de cada estudiante ese mismo día.')}</p></div>
    <div class="grid3">
      <div class="card stat"><span class="eyebrow">${L('Your revenue error', 'Tu error en ingresos')}</span><span class="v">${you >= actual ? '+' : ''}${pct((you - actual) / actual)}</span><span class="d">${L('Class median', 'Mediana del grupo')}: 3.4%</span></div>
      <div class="card stat"><span class="eyebrow">${L('Your margin error', 'Tu error en margen')}</span><span class="v">${youM >= actM ? '+' : ''}${fmt(youM - actM, 1)} ${L('pts', 'pts')}</span><span class="d">${L('You forecast', 'Proyectaste')} ${fmt(youM, 1)}% · ${L('actual', 'real')} ${fmt(actM, 1)}%</span></div>
      <div class="card stat"><span class="eyebrow">${L('Rank in class', 'Lugar en el grupo')}</span><span class="v">7 / 24</span><span class="d">${L('By revenue error', 'Por error en ingresos')}</span></div>
    </div>
    <div class="card">
      <h2>${L('FY2024 revenue, US$ millions', 'Ingresos FY2024, millones de US$')}</h2>
      <div class="bars">
        ${bar('you', L('You (Lucía)', 'Tú (Lucía)'), you, true)}
        ${bar('', L('Warren\'s baseline', 'Línea base de Warren'), warren, true)}
        ${bar('', L('Same as last year', 'Igual que el año pasado'), naive, true)}
        ${bar('actual', L('Actual', 'Real'), actual, false)}
      </div>
      <p class="note">${L('Actual: The Coca-Cola Company 10-K for FY2024, filed 20 Feb 2025, document 0000021344-25-000011. Warren\'s baseline here is an example figure.', 'Real: 10-K de The Coca-Cola Company para FY2024, presentado el 20 feb 2025, documento 0000021344-25-000011. La línea base de Warren aquí es un ejemplo.')}</p>
    </div>
    <div class="grid2">
      <div class="card">
        <h2>${L('Why almost everyone missed the margin', 'Por qué casi todos fallaron el margen')}</h2>
        <p>${L('Operating income fell from 11,311 to 9,992 even though sales grew. Most of the drop came from one-off charges, including a write-down of the BodyArmor sports drink brand that Coca-Cola bought in 2021. Nobody could have seen that in the March 2024 numbers.', 'La utilidad de operación bajó de 11,311 a 9,992 aunque las ventas crecieron. La mayor parte de la caída vino de cargos únicos, incluida la reducción de valor de la marca BodyArmor, que Coca-Cola compró en 2021. Nadie podía verlo en los números de marzo de 2024.')}</p>
        <p class="quote">${L('Question for class: should a one-off charge change your valuation? Defend your answer.', 'Pregunta para la clase: ¿un cargo único debería cambiar tu valuación? Defiende tu respuesta.')}</p>
      </div>
      <div class="card">
        <span class="eyebrow">${L('Your submission', 'Tu entrega')}</span>
        <dl class="kv">
          <dt>${L('Growth', 'Crecimiento')}</dt><dd class="mono">${fmt(g, 1)}%</dd>
          <dt>${L('Margin', 'Margen')}</dt><dd class="mono">${fmt(m, 1)}%</dd>
          <dt>WACC</dt><dd class="mono">${fmt(state.a.w, 1)}%</dd>
          <dt>${L('Data used after 31 Mar 2024', 'Datos usados después del 31 mar 2024')}</dt><dd><span class="flag">${L('None', 'Ninguno')} ✓</span></dd>
        </dl>
        <p class="note">${L('Rebuilt from your saved assumptions: same value to the cent.', 'Reconstruido desde tus supuestos guardados: mismo valor al centavo.')}</p>
      </div>
    </div>
    ${why('A spreadsheet ends when you hand it in. Nobody goes back to check. Warren keeps every forecast and scores it against what the company actually reported, so students learn from being wrong.', 'Una hoja de cálculo termina cuando la entregas. Nadie vuelve a revisar. Warren guarda cada proyección y la califica contra lo que la empresa reportó de verdad, así los estudiantes aprenden de sus errores.')}
    ${nextBtn('professor', 'See the professor\'s view', 'Ver la vista del profesor')}
  </section>`;
}

// ---------- 5. professor ----------
const CLASS = [
  ['Lucía M.', null, null, null], ['Andrés P.', 3.0, 26.0, 7.5], ['Camila R.', 8.0, 25.0, 6.5], ['Mateo G.', 4.5, 24.0, 7.0], ['Valentina S.', 6.0, 27.0, 8.0],
  ['Santiago L.', 2.5, 24.5, 7.2], ['Isabela F.', 5.5, 23.0, 6.8], ['Diego H.', 10.0, 26.5, 6.0], ['Mariana T.', 3.5, 22.0, 7.8], ['Joaquín V.', 4.0, 25.5, 9.0],
  ['Sofía C.', 7.0, 24.0, 7.0], ['Tomás B.', 1.5, 23.5, 7.4],
];
function vProfessor() {
  const actual = 47061;
  const rows = CLASS.map(([n, g, m, w], i) => {
    const a = i === 0 ? state.a : { ...state.a, g, m, w };
    const rev = BASE.rev * (1 + a.g / 100), err = (rev - actual) / actual, ps = dcf(a).ps;
    return { n, g: a.g, m: a.m, w: a.w, err, ps, me: i === 0 };
  }).sort((x, y) => Math.abs(x.err) - Math.abs(y.err));
  const W = 520, H = 70, pad = 24, x = e => pad + (e + .1) / .2 * (W - 2 * pad);
  const dots = rows.map((r, i) => `<circle cx="${x(Math.max(-.1, Math.min(.1, r.err))).toFixed(1)}" cy="${30 + (i % 3) * 8 - 8}" r="${r.me ? 6 : 4.5}" fill="var(${r.me ? '--accent' : '--muted'})" opacity="${r.me ? 1 : .6}"/>`).join('');
  return `<section class="view">
    <div class="head"><span class="eyebrow">${L('Step 5 · Professor view', 'Paso 5 · Vista del profesor')}</span>
      <h1>${L('The whole class, side by side', 'Todo el grupo, lado a lado')}</h1>
      <p>${L('Prof. Ruiz sees every assumption and every error in one place, and picks which disagreements to discuss in class.', 'El Prof. Ruiz ve cada supuesto y cada error en un solo lugar, y elige qué desacuerdos discutir en clase.')}</p></div>
    <div class="grid3">
      <div class="card stat"><span class="eyebrow">${L('Handed in', 'Entregadas')}</span><span class="v">24 / 24</span><span class="d">${L('None used data after the case date', 'Ninguna usó datos posteriores a la fecha del caso')}</span></div>
      <div class="card stat"><span class="eyebrow">${L('Revenue error, median', 'Error en ingresos, mediana')}</span><span class="v">3.4%</span><span class="d">${L('"Same as last year" scored 2.8%', '"Igual que el año pasado" obtuvo 2.8%')}</span></div>
      <div class="card stat"><span class="eyebrow">${L('Widest disagreement', 'Mayor desacuerdo')}</span><span class="v">${L('Growth', 'Crecimiento')}</span><span class="d">${L('From 1.5% to 10% a year', 'De 1.5% a 10% anual')}</span></div>
    </div>
    <div class="card">
      <h2>${L('Revenue error by student', 'Error en ingresos por estudiante')}</h2>
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${L('Each dot is one student', 'Cada punto es un estudiante')}">
        <line x1="${x(0)}" x2="${x(0)}" y1="6" y2="${H - 20}" stroke="var(--ink)" stroke-dasharray="3 3"/>
        <line x1="${pad}" x2="${W - pad}" y1="${H - 20}" y2="${H - 20}" stroke="var(--line)"/>
        ${dots}
        <text x="${x(-.1)}" y="${H - 5}" text-anchor="middle">−10%</text><text x="${x(0)}" y="${H - 5}" text-anchor="middle">${L('actual', 'real')}</text><text x="${x(.1)}" y="${H - 5}" text-anchor="middle">+10%</text>
      </svg>
      <div class="tablebox"><table class="roster"><thead><tr><th>#</th><th>${L('Student', 'Estudiante')}</th><th>${L('Growth', 'Crec.')}</th><th>${L('Margin', 'Margen')}</th><th>WACC</th><th>${L('Value / share (P50)', 'Valor / acción (P50)')}</th><th>${L('Revenue error', 'Error ingresos')}</th></tr></thead><tbody>
        ${rows.map((r, i) => `<tr${r.me ? ' style="background:var(--accent-soft)"' : ''}><td class="num">${i + 1}</td><td>${r.n}</td><td class="num">${fmt(r.g, 1)}%</td><td class="num">${fmt(r.m, 1)}%</td><td class="num">${fmt(r.w, 1)}%</td><td class="num">$${fmt(r.ps, 2)}</td><td class="num">${r.err >= 0 ? '+' : ''}${pct(r.err)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="note">${L('Showing 12 of 24. Names and choices are examples.', 'Se muestran 12 de 24. Nombres y supuestos son ejemplos.')}</p>
    </div>
    <div class="card teaser">
      <span class="eyebrow">${L('Next semester', 'Próximo semestre')}</span>
      <h2>Coca-Cola FEMSA · ${L('IFRS · Mexican pesos', 'NIIF · pesos mexicanos')}</h2>
      <p>${L('The same case, run on Latin America\'s largest Coca-Cola bottler: its IFRS annual report, in pesos, with the interface in Spanish or Portuguese. Students compare the brand owner with the bottler.', 'El mismo caso con el embotellador de Coca-Cola más grande de América Latina: su informe anual en NIIF, en pesos, con la interfaz en español o portugués. Los estudiantes comparan al dueño de la marca con el embotellador.')}</p>
      <span class="chip">${L('Planned, not built yet', 'Planeado, aún no construido')}</span>
    </div>
    ${why('Grading 24 spreadsheets means opening 24 files with 24 different layouts. Here every student used the same tested math, so the professor compares judgment, not formatting.', 'Calificar 24 hojas de cálculo es abrir 24 archivos con 24 formatos distintos. Aquí todos usan la misma matemática probada, así que el profesor compara criterio, no formato.')}
    <div class="row"><a class="btn ghost" href="#assignment">← ${L('Start the tour again', 'Volver al inicio')}</a></div>
  </section>`;
}

// ---------- wiring ----------
const after = {
  company() {
    const s = document.getElementById('asof');
    s.addEventListener('input', () => { state.asOfIdx = +s.value; const y = scrollY; render(); scrollTo(0, y); document.getElementById('asof').focus(); });
  },
  valuation() {
    drawValuation();
    document.querySelectorAll('.sliders input').forEach(el => el.addEventListener('input', () => {
      state.a[el.dataset.k] = +el.value; state.submitted = false;
      document.getElementById('o-' + el.dataset.k).textContent = fmt(+el.value, 1) + '%';
      drawValuation();
    }));
  },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-trace]'), c = e.target.closest('[data-calc]');
  if (t) { mark(t); const [k, y] = t.dataset.trace.split('|'); traceFact(k, +y); }
  if (c) { mark(c); const [k, i] = c.dataset.calc.split('|'); traceCalc(k, +i); }
  if (e.target.id === 'submit') { state.submitted = true; drawValuation(); }
  const lb = e.target.closest('[data-lang]');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('warren-demo-lang', lang); } catch (err) {} closeDrawer(); render(); }
});
function mark(el) { document.querySelectorAll('td.n button.on').forEach(b => b.classList.remove('on')); el.classList.add('on'); }
const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
function openDrawer(title, html) {
  document.getElementById('dr-title').textContent = title;
  document.getElementById('dr-body').innerHTML = html;
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false'); scrim.hidden = false;
  document.getElementById('dr-close').focus();
}
function closeDrawer() {
  drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); scrim.hidden = true;
  document.querySelectorAll('td.n button.on').forEach(b => b.classList.remove('on'));
}
document.getElementById('dr-close').addEventListener('click', closeDrawer);
scrim.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
render();
</script>
