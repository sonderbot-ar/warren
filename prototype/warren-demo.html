<title>Warren Classroom</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a course workspace. Thin top bar, a five-step journey rail, one working screen, and an "explain" panel that slides in when any number is clicked. */
:root {
  --paper: #F3F6F5;
  --surface: #FFFFFF;
  --ink: #13212B;
  --muted: #5A6A72;
  --line: #D5DDDC;
  --accent: #0E6E5C;
  --accent-soft: #DCEEE9;
  --mark: rgba(242, 208, 60, .55);
  --ripple: rgba(242, 208, 60, .28);
  --warn: #A9502A;
  --warn-soft: #F7E6DD;
  --good: #2F7D4A;
  --bad: #B3402A;
  --bar: #13212B;
  --bar-ink: #E9F1EF;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E161B; --surface: #152129; --ink: #E4ECEE; --muted: #93A4AB; --line: #263741;
    --accent: #45B89B; --accent-soft: #173A33; --mark: rgba(242, 208, 60, .30); --ripple: rgba(242, 208, 60, .16);
    --warn: #E39068; --warn-soft: #3A2419; --good: #6CC48A; --bad: #EE8B74; --bar: #08100F; --bar-ink: #E4ECEE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E161B; --surface: #152129; --ink: #E4ECEE; --muted: #93A4AB; --line: #263741;
  --accent: #45B89B; --accent-soft: #173A33; --mark: rgba(242, 208, 60, .30); --ripple: rgba(242, 208, 60, .16);
  --warn: #E39068; --warn-soft: #3A2419; --good: #6CC48A; --bad: #EE8B74; --bar: #08100F; --bar-ink: #E4ECEE;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; font-family: var(--f-body); }
p { margin: 0; }
.num, td.n, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-ink); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.logo svg { display: block; }
.course { font-size: 13px; opacity: .75; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 2px; }
.seg button { background: none; border: 0; color: var(--bar-ink); font-size: 12.5px; padding: 4px 11px; border-radius: 999px; opacity: .75; }
.seg button[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar); opacity: 1; font-weight: 600; }

/* journey rail */
.rail { border-bottom: 1px solid var(--line); background: var(--surface); }
.rail .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.rail a { display: flex; align-items: center; gap: 8px; padding: 12px; text-decoration: none; color: var(--muted); font-size: 13.5px; white-space: nowrap; border-bottom: 2px solid transparent; }
.rail a .k { font-family: var(--f-mono); font-size: 11px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); }
.rail a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.rail a[aria-current="page"] .k { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.rail .who { margin-left: auto; align-self: center; font-size: 11.5px; color: var(--muted); padding-left: 12px; white-space: nowrap; }

main { padding-block: 28px 40px; }
.view { display: grid; gap: 22px; }
.head { display: grid; gap: 8px; max-width: 780px; }
.head p { color: var(--muted); font-size: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 820px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }

.why { display: flex; gap: 12px; align-items: flex-start; border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 14px; }
.why b { font-family: var(--f-display); white-space: nowrap; }
@media (max-width: 520px) { .why { flex-direction: column; gap: 4px; } }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 5px 11px; font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }

.memo .from { display: flex; gap: 12px; align-items: center; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-family: var(--f-display); flex: none; }
.task { display: grid; gap: 10px; counter-reset: t; padding: 0; margin: 0; list-style: none; }
.task li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.task li::before { counter-increment: t; content: counter(t); font-family: var(--f-mono); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; }
.chip { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.panelmap { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.panelmap div { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 2px; font-size: 13px; }
.panelmap b { font-size: 13.5px; }
.panelmap span { color: var(--muted); }
@media (max-width: 820px) { .panelmap { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

/* statements */
.asof { display: grid; gap: 8px; }
.asof-date { font-family: var(--f-mono); font-size: 22px; font-weight: 500; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.ticks { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); }
.tablebox { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.lab { text-align: left; }
td.ref { font-family: var(--f-mono); font-size: 11px; color: var(--muted); width: 28px; padding-right: 0; text-align: left; }
tr.sub td { color: var(--muted); font-size: 13px; }
tr.sec td { padding-top: 14px; font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; border-bottom: 0; }
td.n button { background: none; border: 0; padding: 1px 4px; margin: -1px -4px; border-radius: 3px; font: inherit; color: var(--ink); text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
td.n button:hover, td.n button.on { background: var(--mark); text-decoration: none; }
td.n.rip { background: var(--ripple); }
td.n.rip button { font-weight: 600; }
td.n .was { display: block; font-size: 11px; color: var(--muted); text-decoration: line-through; }
td.locked { color: var(--warn); font-family: var(--f-body); font-size: 12px; background: repeating-linear-gradient(135deg, transparent 0 6px, var(--warn-soft) 6px 8px); }
th.locked { color: var(--warn); }
.hint { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hint i { display: inline-block; width: 26px; height: 12px; background: var(--mark); border-radius: 2px; }
.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--ripple); border: 1px solid var(--mark); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }

/* explain panel */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 40; transform: translateX(105%); transition: transform .22s ease; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); box-shadow: -12px 0 30px rgba(0,0,0,.12); }
.drawer.open { transform: none; }
.drawer header { display: grid; gap: 8px; padding: 14px 18px 0; border-bottom: 1px solid var(--line); }
.dr-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.drawer .x { background: none; border: 1px solid var(--line); border-radius: 6px; width: 30px; height: 30px; flex: none; }
.big { font-family: var(--f-mono); font-size: 28px; font-weight: 500; background: var(--mark); display: inline-block; padding: 0 6px; border-radius: 3px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.drawer .body { padding: 18px; overflow-y: auto; display: grid; gap: 14px; align-content: start; flex: 1; }
.chain { display: grid; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.chain > div { padding: 10px 12px; display: grid; gap: 2px; font-size: 13.5px; }
.chain > div + div { border-top: 1px dashed var(--line); }
.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
code { font-family: var(--f-mono); font-size: 13px; word-break: break-word; }
.excel { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.excel .cell { font-family: var(--f-mono); background: var(--paper); border: 1px solid var(--line); padding: 4px 8px; color: var(--ink); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.steps code { background: var(--paper); padding: 0 4px; border-radius: 3px; }
.concept p + p { margin-top: 8px; }
.concept .ex { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); font-size: 14px; }
.edit { display: grid; gap: 8px; }
.edit-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.edit input[type="number"] { width: 150px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font-family: var(--f-mono); }
.radios { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; }
.ripples { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.ripples > div { padding: 9px 12px; display: grid; gap: 2px; font-size: 13.5px; }
.ripples > div + div { border-top: 1px solid var(--line); }
.rp-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.rp-top .mono { font-weight: 500; }
.up { color: var(--good); } .down { color: var(--bad); }
.rp-why { color: var(--muted); font-size: 13px; }
.news { display: grid; gap: 10px; }
.news article { display: grid; gap: 2px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.news .d { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.news .rel { font-size: 12.5px; color: var(--accent); }
.tickers { display: grid; gap: 8px; }
.tk { display: grid; grid-template-columns: 74px 1fr; gap: 10px; font-size: 13.5px; align-items: baseline; }
.tk b { font-family: var(--f-mono); font-weight: 500; }
.tk span small { color: var(--accent); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); }
.scrim { position: fixed; inset: 0; background: rgba(10, 20, 25, .35); z-index: 35; }
@media (min-width: 900px) { .scrim { display: none; } main .wrap { transition: padding .22s ease; } body.panel-open main .wrap { padding-right: 476px; max-width: none; } }

/* valuation */
.sliders { display: grid; gap: 16px; }
.sl { display: grid; gap: 4px; }
.sl-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.sl-top label { font-weight: 600; font-size: 14px; }
.sl-top output { font-family: var(--f-mono); font-size: 15px; font-weight: 500; }
.sl small { color: var(--muted); font-size: 12.5px; }
.sl small b { color: var(--ink); font-weight: 500; }
.result { display: grid; gap: 14px; }
.range { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.range div { display: grid; gap: 2px; padding: 10px 6px; border-radius: 8px; border: 1px solid var(--line); }
.range div.mid { border-color: var(--accent); background: var(--accent-soft); }
.range .v { font-family: var(--f-mono); font-size: 22px; font-weight: 500; }
.range .l { font-size: 11.5px; color: var(--muted); }
svg text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.submitted { display: flex; gap: 10px; align-items: center; color: var(--good); font-weight: 600; font-size: 14px; }

/* reality */
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 92px; gap: 10px; align-items: center; font-size: 13.5px; }
.bar .track { height: 22px; position: relative; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--line); }
.bar.you .fill { background: var(--accent); }
.bar.actual .fill { background: var(--ink); }
.bar .val { font-family: var(--f-mono); text-align: right; }
.bar .err { font-size: 11.5px; color: var(--muted); display: block; }
@media (max-width: 520px) { .bar { grid-template-columns: 96px minmax(0, 1fr) 80px; } }
.stat { display: grid; gap: 4px; }
.stat .v { font-family: var(--f-display); font-size: 30px; font-weight: 700; }
.stat .d { font-size: 13px; color: var(--muted); }
.quote { font-size: 15px; border-left: 3px solid var(--line); padding-left: 12px; }
.roster td:nth-child(2), .roster th:nth-child(2) { text-align: left; }
.teaser { border: 1px dashed var(--accent); background: transparent; }
.flag { font-size: 12px; color: var(--good); font-weight: 600; }

footer { border-top: 1px solid var(--line); padding-block: 18px 30px; font-size: 12.5px; color: var(--muted); }
footer .wrap { display: grid; gap: 4px; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="logo" aria-label="Warren">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="12" width="4" height="9" rx="1" fill="currentColor" opacity=".55"/><rect x="7" y="7" width="4" height="14" rx="1" fill="currentColor" opacity=".75"/><rect x="13" y="2" width="4" height="19" rx="1" fill="currentColor"/><circle cx="19.5" cy="3.5" r="2" fill="#F2D03C"/></svg>
      Warren
    </div>
    <div class="course" id="course"></div>
    <div class="seg" role="group" aria-label="Role">
      <button id="role-student" data-role="student"></button>
      <button id="role-prof" data-role="professor"></button>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-en" data-lang="en">EN</button>
      <button id="lang-es" data-lang="es">ES</button>
    </div>
  </div>
</header>
<nav class="rail" aria-label="Journey"><div class="wrap" id="rail"></div></nav>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap" id="foot"></div></footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="dr-title">
  <header>
    <div class="dr-top"><div><span class="eyebrow" id="dr-sub"></span><h2 id="dr-title"></h2></div><button class="x" id="dr-close" aria-label="Close">✕</button></div>
    <div id="dr-big"></div>
    <div class="tabs" role="tablist" id="dr-tabs"></div>
  </header>
  <div class="body" id="dr-body" role="tabpanel"></div>
</aside>

<script>
// ---------- language ----------
let lang = 'en';
try { lang = localStorage.getItem('warren-demo-lang') || 'en'; } catch (e) {}
const L = (en, es) => lang === 'es' ? es : en;
const fmt = (x, d = 0) => (+x).toLocaleString(lang === 'es' ? 'es-MX' : 'en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (x, d = 1) => fmt(x * 100, d) + '%';
const fdate = s => new Date(s + 'T12:00:00Z').toLocaleDateString(lang === 'es' ? 'es-MX' : 'en-US', { day: 'numeric', month: 'short', year: 'numeric' });
const sgn = (x, d = 0) => (x > 0 ? '+' : x < 0 ? '−' : '') + fmt(Math.abs(x), d);

// ---------- real data: Apple Inc. (CIK 0000320193), US$ millions ----------
// Pulled with Warren's point-in-time data layer (SEC EDGAR). Receivables, inventory, payables and
// cash from operations were read from the same filings; they are not yet in Warren's Phase 1 data set.
const FIL = {
  k22: { form: '10-K', name: ['Annual report FY2022', 'Informe anual FY2022'], filed: '2022-10-28', acc: '0000320193-22-000108' },
  k23: { form: '10-K', name: ['Annual report FY2023', 'Informe anual FY2023'], filed: '2023-11-03', acc: '0000320193-23-000106' },
  q24: { form: '10-Q', name: ['Quarterly report, Dec 2023', 'Informe trimestral, dic 2023'], filed: '2024-02-02', acc: '0000320193-24-000006' },
  k24: { form: '10-K', name: ['Annual report FY2024', 'Informe anual FY2024'], filed: '2024-11-01', acc: '0000320193-24-000123' },
};
const YEARS = [2023, 2022, 2021]; // newest first, as in a 10-K
const PERIOD = { 2023: ['2022-09-25', '2023-09-30'], 2022: ['2021-09-26', '2022-09-24'], 2021: ['2020-09-27', '2021-09-25'] };
const COLS = { 2023: 'B', 2022: 'C', 2021: 'D' };
// kind: f = flow (income/cash flow), s = stock (balance sheet), d = derived by Warren. w = in Warren's Phase 1 data set.
const ITEMS = [
  { sec: ['Income statement', 'Estado de resultados'] },
  { k: 'rev', kind: 'f', w: 1, n: ['Revenue', 'Ingresos'], tag: 'us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax', v: { 2023: 383285, 2022: 394328, 2021: 365817 } },
  { k: 'cogs', kind: 'f', w: 1, n: ['Cost of sales', 'Costo de ventas'], tag: 'us-gaap:CostOfGoodsAndServicesSold', v: { 2023: 214137, 2022: 223546, 2021: 212981 } },
  { k: 'gp', kind: 'd', n: ['Gross profit', 'Utilidad bruta'], f: '{rev}-{cogs}' },
  { k: 'opex', kind: 'f', w: 1, n: ['Operating expenses', 'Gastos de operación'], tag: 'us-gaap:OperatingExpenses', v: { 2023: 54847, 2022: 51345, 2021: 43887 } },
  { k: 'oi', kind: 'd', n: ['Operating income', 'Utilidad de operación'], f: '{gp}-{opex}', check: 'us-gaap:OperatingIncomeLoss' },
  { k: 'margin', kind: 'd', pct: 1, sub: 1, n: ['Operating margin', 'Margen operativo'], f: '{oi}/{rev}' },

        <p class="quote">${L('Question for class: should a one-off tax charge change your valuation? Defend your answer.', 'Pregunta para la clase: ¿un cargo fiscal único debería cambiar tu valuación? Defiende tu respuesta.')}</p>
      </div>
      <div class="card">
        <span class="eyebrow">${L('Your submission', 'Tu entrega')}</span>
        <dl class="kv">
          <dt>${L('Growth', 'Crecimiento')}</dt><dd class="mono">${fmt(g, 1)}%</dd>
          <dt>${L('Margin', 'Margen')}</dt><dd class="mono">${fmt(m, 1)}%</dd>
          <dt>WACC</dt><dd class="mono">${fmt(state.a.w, 1)}%</dd>
          <dt>${L('Data used after 31 Mar 2024', 'Datos usados después del 31 mar 2024')}</dt><dd><span class="flag">${L('None', 'Ninguno')} ✓</span></dd>
        </dl>
        <p class="note">${L('Rebuilt from your saved assumptions: same value to the cent.', 'Reconstruido desde tus supuestos guardados: mismo valor al centavo.')}</p>
      </div>
    </div>
    ${why('A spreadsheet ends when you hand it in. Nobody goes back to check. Warren keeps every forecast and scores it against what the company actually reported, so students learn from being wrong.', 'Una hoja de cálculo termina cuando la entregas. Nadie vuelve a revisar. Warren guarda cada proyección y la califica contra lo que la empresa reportó de verdad, así los estudiantes aprenden de sus errores.')}
    ${nextBtn('professor', 'See the professor\'s view', 'Ver la vista del profesor')}
  </section>`;
}

// ---------- 5. professor ----------
const CLASS = [['Lucía M.'], ['Andrés P.', 4.0, 30.5, 8.0], ['Camila R.', 8.0, 31.0, 8.5], ['Mateo G.', 3.0, 29.0, 9.0], ['Valentina S.', 7.0, 32.0, 7.8],
  ['Santiago L.', 2.0, 29.5, 8.7], ['Isabela F.', 5.0, 30.0, 9.5], ['Diego H.', 10.0, 33.0, 7.5], ['Mariana T.', 1.5, 28.5, 8.2], ['Joaquín V.', 4.5, 30.0, 10.0],
  ['Sofía C.', 6.5, 31.5, 8.5], ['Tomás B.', -1.0, 28.0, 9.0]];
function vProfessor() {
  const actual = 391035;
  const rows = CLASS.map(([n, g, m, w], i) => { const a = i === 0 ? state.a : { ...state.a, g, m, w }, rev = BASE.rev * (1 + a.g / 100);
    return { n, g: a.g, m: a.m, w: a.w, err: (rev - actual) / actual, ps: dcf(a).ps, me: i === 0 }; }).sort((x, y) => Math.abs(x.err) - Math.abs(y.err));
  const W = 520, H = 70, pad = 24, x = e => pad + (e + .1) / .2 * (W - 2 * pad);
  const dots = rows.map((r, i) => `<circle cx="${x(Math.max(-.1, Math.min(.1, r.err))).toFixed(1)}" cy="${30 + (i % 3) * 8 - 8}" r="${r.me ? 6 : 4.5}" fill="var(${r.me ? '--accent' : '--muted'})" opacity="${r.me ? 1 : .6}"/>`).join('');
  return `<section class="view">
    <div class="head"><span class="eyebrow">${L('Step 5 · Professor view', 'Paso 5 · Vista del profesor')}</span>
      <h1>${L('The whole class, side by side', 'Todo el grupo, lado a lado')}</h1>
      <p>${L('Prof. Ruiz sees every assumption and every error in one place, and picks which disagreements to discuss in class.', 'El Prof. Ruiz ve cada supuesto y cada error en un solo lugar, y elige qué desacuerdos discutir en clase.')}</p></div>
    <div class="grid3">
      <div class="card stat"><span class="eyebrow">${L('Handed in', 'Entregadas')}</span><span class="v">24 / 24</span><span class="d">${L('None used data after the case date', 'Ninguna usó datos posteriores a la fecha del caso')}</span></div>
      <div class="card stat"><span class="eyebrow">${L('Most opened explanation', 'Explicación más abierta')}</span><span class="v">${L('Net debt', 'Deuda neta')}</span><span class="d">${L('19 of 24 students; 11 tried a what-if on inventory', '19 de 24 estudiantes; 11 probaron un ¿y si…? con inventario')}</span></div>
      <div class="card stat"><span class="eyebrow">${L('Widest disagreement', 'Mayor desacuerdo')}</span><span class="v">${L('Growth', 'Crecimiento')}</span><span class="d">${L('From −1% to 10% a year', 'De −1% a 10% anual')}</span></div>
    </div>
    <div class="card">
      <h2>${L('Revenue error by student', 'Error en ingresos por estudiante')}</h2>
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${L('Each dot is one student', 'Cada punto es un estudiante')}">
        <line x1="${x(0)}" x2="${x(0)}" y1="6" y2="${H - 20}" stroke="var(--ink)" stroke-dasharray="3 3"/>
        <line x1="${pad}" x2="${W - pad}" y1="${H - 20}" y2="${H - 20}" stroke="var(--line)"/>${dots}
        <text x="${x(-.1)}" y="${H - 5}" text-anchor="middle">−10%</text><text x="${x(0)}" y="${H - 5}" text-anchor="middle">${L('actual', 'real')}</text><text x="${x(.1)}" y="${H - 5}" text-anchor="middle">+10%</text>
      </svg>
      <div class="tablebox"><table class="roster"><thead><tr><th>#</th><th>${L('Student', 'Estudiante')}</th><th>${L('Growth', 'Crec.')}</th><th>${L('Margin', 'Margen')}</th><th>WACC</th><th>${L('Value / share', 'Valor / acción')}</th><th>${L('Revenue error', 'Error ingresos')}</th></tr></thead><tbody>
        ${rows.map((r, i) => `<tr${r.me ? ' style="background:var(--accent-soft)"' : ''}><td class="num">${i + 1}</td><td>${r.n}</td><td class="num">${fmt(r.g, 1)}%</td><td class="num">${fmt(r.m, 1)}%</td><td class="num">${fmt(r.w, 1)}%</td><td class="num">$${fmt(r.ps, 0)}</td><td class="num">${r.err >= 0 ? '+' : ''}${pct(r.err)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="note">${L('Showing 12 of 24. Names and choices are examples.', 'Se muestran 12 de 24. Nombres y supuestos son ejemplos.')}</p>
    </div>
    <div class="card teaser">
      <span class="eyebrow">${L('Next semester', 'Próximo semestre')}</span>
      <h2>América Móvil · ${L('IFRS · Mexican pesos', 'NIIF · pesos mexicanos')}</h2>
      <p>${L('The same case on a Latin American company: Latin America\'s largest telecom group, from its IFRS annual report, in pesos, with the interface in Spanish or Portuguese. It sells iPhones, so students can link the two cases.', 'El mismo caso con una empresa latinoamericana: el mayor grupo de telecomunicaciones de América Latina, con su informe anual en NIIF, en pesos, y la interfaz en español o portugués. Vende iPhones, así que los estudiantes pueden ligar ambos casos.')}</p>
      <span class="chip">${L('Planned, not built yet', 'Planeado, aún no construido')}</span>
    </div>
    ${why('Grading 24 spreadsheets means opening 24 files with 24 different layouts. Here every student used the same tested math, so the professor compares judgment, not formatting, and can see which concepts the class had to look up.', 'Calificar 24 hojas de cálculo es abrir 24 archivos con 24 formatos distintos. Aquí todos usan la misma matemática probada, así que el profesor compara criterio, no formato, y ve qué conceptos tuvo que consultar el grupo.')}
    <div class="row"><a class="btn ghost" href="#assignment">← ${L('Start the tour again', 'Volver al inicio')}</a></div>
  </section>`;
}

// ---------- panel ----------
const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
let panel = null;
function openPanel(p) {
  panel = p;
  document.getElementById('dr-sub').textContent = p.sub;
  document.getElementById('dr-title').textContent = p.title;
  document.getElementById('dr-big').innerHTML = `<span class="big">${p.big}</span> <span class="note">${p.unit || ''}</span>`;
  showTab(p.tabs.find(t => t.id === p.tab) ? p.tab : p.tabs[0].id);
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false'); scrim.hidden = false; document.body.classList.add('panel-open');
}
function showTab(id) {
  const t = panel.tabs.find(x => x.id === id); panel.tab = id;
  document.getElementById('dr-tabs').innerHTML = panel.tabs.map(x => `<button role="tab" data-tab="${x.id}" aria-selected="${x.id === id}">${x.label}</button>`).join('');
  document.getElementById('dr-body').innerHTML = t.html();
  if (t.init) { const m = panel.key; t.init(m && m[0], m && m[1]); }
}
function closeDrawer() {
  drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); scrim.hidden = true; panel = null; document.body.classList.remove('panel-open');
  document.querySelectorAll('td.n button.on').forEach(b => b.classList.remove('on'));
}
function mark(el) { document.querySelectorAll('td.n button.on').forEach(b => b.classList.remove('on')); el && el.classList.add('on'); }
function openCell(k, y, tab) { explainCell(k, y, tab); panel.key = [k, y]; showTab(panel.tab); }

// ---------- wiring ----------
const after = {
  company() {
    const s = document.getElementById('asof');
    s.addEventListener('input', () => { state.asOfIdx = +s.value; const y = scrollY; render(); scrollTo(0, y); document.getElementById('asof').focus(); });
    const rb = document.getElementById('wi-reset');
    if (rb) rb.addEventListener('click', () => { state.whatif = null; rerenderBehind(); if (panel && panel.tab === 'whatif') showTab('whatif'); });
  },
  valuation() {
    drawValuation();
    document.querySelectorAll('.sliders input').forEach(el => el.addEventListener('input', () => {
      state.a[el.dataset.k] = +el.value; state.submitted = false;
      document.getElementById('o-' + el.dataset.k).textContent = fmt(+el.value, 1) + '%';
      drawValuation();
    }));
  },
};
document.addEventListener('click', e => {
  const c = e.target.closest('[data-cell]'), q = e.target.closest('[data-calc]'), go = e.target.closest('[data-cell-go]'), tb = e.target.closest('[data-tab]');
  if (c) { mark(c); const [k, y] = c.dataset.cell.split('|'); openCell(k, +y, panel ? panel.tab : 'source'); }
  if (q) { mark(q); const [k, i] = q.dataset.calc.split('|'); explainCalc(k, +i, panel ? panel.tab : 'formula'); }
  if (go) { const [k, y, t] = go.dataset.cellGo.split('|'); if (current() !== 'company') { location.hash = 'company'; } setTimeout(() => { mark(document.querySelector(`[data-cell="${k}|${y}"]`)); openCell(k, +y, t || 'whatif'); }, 60); }
  if (tb) showTab(tb.dataset.tab);
  if (e.target.id === 'submit') { state.submitted = true; drawValuation(); }
  const lb = e.target.closest('[data-lang]');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('warren-demo-lang', lang); } catch (err) {} closeDrawer(); render(); }
  const rl = e.target.closest('[data-role]');
  if (rl) location.hash = rl.dataset.role === 'professor' ? 'professor' : (current() === 'professor' ? 'assignment' : current());
});
document.getElementById('dr-close').addEventListener('click', closeDrawer);
scrim.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
render();
</script>
